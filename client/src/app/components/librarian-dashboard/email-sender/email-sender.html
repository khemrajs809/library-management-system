@if (email) {
  <div class="modal-overlay" (click)="closeModal()">
    <div class="modal-content email-modal" (click)="stopPropagation($event)">
      <div class="modal-header">
        <h3 class="ds-style-3606b3db">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Compose Email
        </h3>
        <button class="btn btn-red btn-sm ds-style-74b15169" (click)="closeModal()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Close
        </button>
      </div>
      
      <div class="modal-body">
        <div class="form-group ds-style-18ed1741">
          <label class="ds-style-49bd0cf8">To:</label>
          <input type="text" class="form-control ds-style-4a6446ac" [value]="email" disabled>
        </div>

        <div class="form-group ds-style-18ed1741">
          <label class="ds-style-49bd0cf8">Subject:</label>
          <input type="text" class="form-control" [(ngModel)]="subject" placeholder="Enter email subject...">
        </div>

        <div class="form-group ds-style-18e1459b">
          <label class="ds-style-49bd0cf8">Message:</label>
          <textarea class="form-control ds-style-6defaa15" [(ngModel)]="message" rows="6" placeholder="Type your message here..."></textarea>
        </div>

        <div class="ds-style-74defc00">
          <button class="btn btn-red-outline" (click)="closeModal()" [disabled]="isSending()">Cancel</button>
          <button class="btn btn-red ds-style-3f6a67db" (click)="sendEmail()" [disabled]="isSending()">
            @if (isSending()) {
              <svg class="lms-spinner-inline ds-style-212e2e36" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
              Sending...
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Send Email
            }
          </button>
        </div>
      </div>
    </div>
  </div>
}
