<div class="forgot-container">
    <div class="forgot-card">
        <div class="forgot-header">
            <img src="/logolms.webp" alt="Library Logo" class="forgot-logo" fetchpriority="high" width="800" height="436">
            <h2>Reset Password</h2>
            <p>{{ step() === 1 ? 'Enter your email to receive a security code.' : 'Enter the code and your new password.' }}</p>
        </div>

        @if (error()) {
            <div class="error-alert">
                {{ error() }}
            </div>
        }

        <!-- Step 1: Request OTP -->
        @if (step() === 1) {
            <form class="forgot-form" (submit)="onRequestOTP()">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </span>
                        <input type="email" id="email" name="email" [(ngModel)]="data.email" placeholder="staff@lms.com" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-red btn-block" [disabled]="isLoading()">
                    @if (isLoading()) { <app-spinner [size]="20" class="white-spinner" /> }
                    @else { Send Reset Code }
                </button>
            </form>
        }

        <!-- Step 2: Verify & Reset -->
        @else {
            <form class="forgot-form" (submit)="onResetPassword()">
                <div class="form-group">
                    <label for="otp">Security Code</label>
                    <div class="input-wrapper">
                        <span class="icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        </span>
                        <input type="text" id="otp" name="otp" [(ngModel)]="data.otp" placeholder="000000" required maxlength="6">
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <span class="icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input [type]="showPassword() ? 'text' : 'password'" id="newPassword" name="newPassword" [(ngModel)]="data.newPassword" placeholder="••••••••" required minlength="6">
                        <button type="button" class="toggle-btn" (click)="togglePassword()">
                            @if (showPassword()) {
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            } @else {
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            }
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input [type]="showConfirmPassword() ? 'text' : 'password'" id="confirmPassword" name="confirmPassword" [(ngModel)]="data.confirmPassword" placeholder="••••••••" required minlength="6">
                        <button type="button" class="toggle-btn" (click)="toggleConfirmPassword()">
                            @if (showConfirmPassword()) {
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            } @else {
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            }
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-red btn-block" [disabled]="isLoading()">
                    @if (isLoading()) { <app-spinner [size]="20" class="white-spinner" /> }
                    @else { Update Password }
                </button>

                <button type="button" class="btn btn-link btn-block mt-10" (click)="backToStep1()">
                    Back to email entry
                </button>
            </form>
        }

        <div class="forgot-footer">
            <p>Back to <a routerLink="/login">Sign In</a></p>
        </div>
    </div>
</div>
