<div class="monitoring-dashboard-container">
  <!-- Dashboard Header -->
  <header class="dashboard-header no-print">
    <div class="header-content">
      <div class="title-section">
        <h1>Borrowed Books Monitoring</h1>
        <p class="subtitle">Complete visibility into overdue books, delayed members, and inventory shortages.</p>
      </div>
      <div class="action-section">
        <button class="btn btn-secondary" (click)="exportPDF()"><i class="fas fa-file-pdf"></i> Export PDF</button>
        <button class="btn btn-secondary" (click)="exportExcel()"><i class="fas fa-file-excel"></i> Export Excel</button>
        <button class="btn btn-primary" (click)="printReport()"><i class="fas fa-print"></i> Print Report</button>
      </div>
    </div>
  </header>

  <!-- Dashboard Content Area -->
  <div class="dashboard-content-area">
    
    @if (isLoading()) {
      <div class="loading-state fade-in" style="padding: 3rem; text-align: center; color: #868e96;">
        <i class="fas fa-circle-notch fa-spin fa-3x" style="color: #4dabf7; margin-bottom: 1rem;"></i>
        <p>Loading real-time monitoring data...</p>
      </div>
    } @else if (dashboardData()) {
      <!-- Single Unified Monitoring Table -->
      <div class="section-container fade-in">
        <app-overdue-members-table [data]="dashboardData().overdueMembers"></app-overdue-members-table>
      </div>
    }

  </div>
</div>
