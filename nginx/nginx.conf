# Enterprise NGINX Configuration

# Define rate limiting zones at the global level
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=50r/s;

# ---------------------------------------------------------
# HTTP (Port 80) - Redirects to HTTPS
# ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _; # In production, replace '_' with 'yourdomain.com'

    # Allow Let's Encrypt ACME Challenge for SSL Certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------
# HTTPS (Port 443) - Main Enterprise Server
# ---------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _; # In production, replace '_' with 'yourdomain.com'

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    # ⚠️ For production, replace the paths above with your Let's Encrypt certificates:
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # If no SSL certs are available, NGINX might fail to boot. 
    # To run locally without SSL, you can comment out the `listen 443 ssl` blocks above, 
    # OR use self-signed certs.

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;

    # Slowloris / Buffer Protections
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    client_max_body_size 8M; # Max upload size (for CSVs/Photos)
    large_client_header_buffers 2 1k;
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # GZIP Compression for massive performance gains
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ---------------------------------------------------------
    # Static Asset Optimization (Browser Caching)
    # ---------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        # Serve static assets from Frontend container
        proxy_pass http://lms-frontend:4000;
        
        # Cache in browser for 1 year
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off; # Don't clutter logs with static file hits
        
        limit_req zone=static_limit burst=100 nodelay;
    }

    # ---------------------------------------------------------
    # Backend API Routing (Forward to Node.js)
    # ---------------------------------------------------------
    location /api/ {
        # Edge Rate Limiting: 10 req/sec, burst up to 20, immediately drop excess
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://lms-backend:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for backend connection
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------
    # Frontend Routing (Forward to Angular SSR Server)
    # ---------------------------------------------------------
    location / {
        proxy_pass http://lms-frontend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Protect against slow rendering loops
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
