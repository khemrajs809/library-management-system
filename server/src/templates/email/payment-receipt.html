<h2>Payment Confirmation Receipt</h2>
<p>Dear {{memberName}},</p>
<p>We successfully received your payment. Your dues for the following book have been completely cleared:</p>

<div class="highlight-box">
    <table class="table">
        <tr>
            <th>Book Title</th>
            <td>{{bookTitle}}</td>
        </tr>
        <tr>
            <th>Amount Paid</th>
            <td style="color: #16a34a; font-weight: bold;">₹{{amount}}</td>
        </tr>
        <tr>
            <th>Date</th>
            <td>{{date}}</td>
        </tr>
    </table>
</div>

<p>Thank you for settling your account.</p>
